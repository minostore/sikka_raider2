name: بناء التطبيق (Android APK + iOS)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: زيادة الإصدار عند تشغيل بناء يدوي
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 tool/bump_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/core/app_version.dart
          git commit -m "chore: bump release version [skip ci]"
          git push
      - id: release-ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: تثبيت NDK مع إعادة المحاولة (حل مشكلة الملف التالف)
        shell: bash
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            echo "محاولة تثبيت NDK رقم $i"
            rm -rf "$SDK/ndk/$NDK_VERSION"
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$SDK/ndk/$NDK_VERSION/source.properties" ]; then
              echo "تم تثبيت NDK بنجاح"
              exit 0
            fi
            sleep 10
          done
          echo "فشل تثبيت NDK بعد 3 محاولات"
          exit 1
      - name: ترحيل ملفات Android Gradle أولاً
        run: flutter build apk --release --target-platform android-arm64 --config-only
      - name: إصلاح توافق Java وKotlin في التطبيق وكل الإضافات
        run: python3 tool/patch_platforms.py "com.sikka.driver"
      - name: فرض Android compileSdk 36 في كل ملفات Gradle والتحقق
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          files = list(Path("android").glob("**/app/build.gradle.kts")) + list(Path("android").glob("**/app/build.gradle"))
          files = [p for p in files if p.parent.name == "app"]
          if not files:
              raise SystemExit("ERROR: no Android app Gradle file found")
          for p in files:
              s = p.read_text()
              s, n1 = re.subn(r"(?m)^(\s*)compileSdk\s*=.*$", r"\g<1>compileSdk = 36", s)
              if n1 == 0:
                  s, n2 = re.subn(r"(?m)^(\s*)compileSdkVersion\s+.*$", r"\g<1>compileSdkVersion 36", s)
                  if n2 == 0:
                      raise SystemExit(f"ERROR: compileSdk declaration not found in {p}")
              # Align Java and Kotlin bytecode targets to 17; tflite_flutter uses Kotlin 17.
              if p.name.endswith(".kts"):
                  if "targetCompatibility = JavaVersion.VERSION_17" not in s:
                      s = re.sub(r"(compileOptions\s*\{)", r"\1\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17", s, count=1)
                  if "jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)" not in s:
                      s += '\nkotlin { compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) } }\n'
              else:
                  if "targetCompatibility JavaVersion.VERSION_17" not in s:
                      s = re.sub(r"(compileOptions\s*\{)", r"\1\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17", s, count=1)
                  if not re.search(r"(?m)^\s*jvmTarget\s*=\s*'17'", s):
                      s = re.sub(r"(kotlinOptions\s*\{)", r"\1\n        jvmTarget = '17'", s, count=1) if "kotlinOptions" in s else s + "\nkotlinOptions { jvmTarget = '17' }\n"
              p.write_text(s)
              print(f"--- {p} ---")
              print("\n".join(x for x in s.splitlines() if "compileSdk" in x or "targetCompatibility" in x or "jvmTarget" in x))
              if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$", s):
                  raise SystemExit(f"ERROR: compileSdk is not 36 in {p}")
          PYCODE
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: اختبارات Flutter
        run: flutter test
      - name: توقيع الإصدار بمفتاح ثابت
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::سر ANDROID_KEYSTORE_BASE64 ليس base64 صالحًا. أعد إنشاءه بالأمر: base64 -w0 release.jks"; exit 1; }
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            # فحص الملف وكلمة مرور المخزن واسم المفتاح قبل البناء برسالة واضحة
            if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::error::تعذر فتح ملف المفتاح. تحقق أن ANDROID_KEYSTORE_PASSWORD هي كلمة مرور المخزن (store password) وأن ANDROID_KEYSTORE_BASE64 هو الملف كاملًا."
              exit 1
            fi
            if ! keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::اسم المفتاح ANDROID_KEY_ALIAS غير موجود داخل الملف. الأسماء الموجودة:"
              grep -iE "PrivateKeyEntry|trustedCertEntry" "$RUNNER_TEMP/ks.txt" | sed 's/,.*//' || true
              exit 1
            fi
            # مخزن PKCS12 (الافتراضي في keytool الحديث) يتطلب أن تكون كلمة مرور المفتاح هي نفسها كلمة مرور المخزن
            if grep -qi "PKCS12" "$RUNNER_TEMP/ks.txt" && [ "$ANDROID_KEY_PASSWORD" != "$ANDROID_KEYSTORE_PASSWORD" ]; then
              echo "::warning::المخزن من نوع PKCS12؛ سيُستخدم ANDROID_KEYSTORE_PASSWORD ككلمة مرور المفتاح."
              ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            export ANDROID_KEY_PASSWORD
          fi
          python3 tool/apply_signing.py
      - name: بناء APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sikka_driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: release-version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: بناء iOS (بدون توقيع)
        run: flutter build ios --release --no-codesign
