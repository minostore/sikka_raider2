name: بناء التطبيق (Android APK + iOS)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: زيادة الإصدار عند تشغيل بناء يدوي
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 tool/bump_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/core/app_version.dart
          git commit -m "chore: bump release version [skip ci]"
          git push
      - id: release-ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: تهيئة مشروع Android وترحيل Gradle قبل ضبط SDK
        run: flutter build apk --release --target-platform android-arm64 --config-only
      - name: فرض Android compileSdk 36 والتحقق منه
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re, sys
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: Android app Gradle file was not generated")
          s = p.read_text()
          if re.search(r"(?m)^\s*compileSdk\s*=", s):
              s = re.sub(r"(?m)^(\s*)compileSdk\s*=.*$", r"\g<1>compileSdk = 36", s, count=1)
          elif re.search(r"(?m)^\s*compileSdkVersion\b", s):
              s = re.sub(r"(?m)^(\s*)compileSdkVersion\b.*$", r"\g<1>compileSdkVersion 36", s, count=1)
          else:
              raise SystemExit("ERROR: compileSdk declaration not found")
          p.write_text(s)
          print("Patched", p)
          print("\n".join(x for x in s.splitlines() if "compileSdk" in x))
          if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$", s):
              raise SystemExit("ERROR: compileSdk is not 36")
          PYCODE
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: اختبارات Flutter
        run: flutter test
      - name: بناء APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sikka_driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: release-version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: بناء iOS (بدون توقيع)
        run: flutter build ios --release --no-codesign
