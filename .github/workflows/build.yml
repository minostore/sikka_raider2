name: بناء التطبيق (Android APK + iOS)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release-version:
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: زيادة الإصدار عند تشغيل بناء يدوي
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 tool/bump_version.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/core/app_version.dart
          git commit -m "chore: bump release version [skip ci]"
          git push
      - id: release-ref
        run: echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  android:
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: تثبيت NDK مع إعادة المحاولة (حل مشكلة الملف التالف)
        shell: bash
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            echo "محاولة تثبيت NDK رقم $i"
            rm -rf "$SDK/ndk/$NDK_VERSION"
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            if [ -f "$SDK/ndk/$NDK_VERSION/source.properties" ]; then
              echo "تم تثبيت NDK بنجاح"
              exit 0
            fi
            sleep 10
          done
          echo "فشل تثبيت NDK بعد 3 محاولات"
          exit 1
      - name: ترحيل ملفات Android Gradle أولاً
        run: flutter build apk --release --target-platform android-arm64 --config-only
      - name: فرض Android compileSdk 36 في كل ملفات Gradle والتحقق
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          files = list(Path("android").glob("**/app/build.gradle.kts")) + list(Path("android").glob("**/app/build.gradle"))
          files = [p for p in files if p.parent.name == "app"]
          if not files:
              raise SystemExit("ERROR: no Android app Gradle file found")
          for p in files:
              s = p.read_text()
              s, n1 = re.subn(r"(?m)^(\s*)compileSdk\s*=.*$", r"\g<1>compileSdk = 36", s)
              if n1 == 0:
                  s, n2 = re.subn(r"(?m)^(\s*)compileSdkVersion\s+.*$", r"\g<1>compileSdkVersion 36", s)
                  if n2 == 0:
                      raise SystemExit(f"ERROR: compileSdk declaration not found in {p}")
              p.write_text(s)
              print(f"--- {p} ---")
              print("\n".join(x for x in s.splitlines() if "compileSdk" in x))
              if not re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?36\s*$", s):
                  raise SystemExit(f"ERROR: compileSdk is not 36 in {p}")
          PYCODE
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: اختبارات Flutter
        run: flutter test
      - name: بناء APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sikka_driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: release-version
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.release_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: بناء iOS (بدون توقيع)
        run: flutter build ios --release --no-codesign
