name: بناء التطبيق (Android APK + iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: تحليل الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: اختبارات Flutter
        run: flutter test
      - name: بناء APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sikka_driver-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تجهيز منصات Android/iOS
        run: bash tool/setup_platforms.sh
      - name: بناء iOS (بدون توقيع)
        run: flutter build ios --release --no-codesign
